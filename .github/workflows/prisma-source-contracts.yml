name: Prisma source contract tests

on:
  pull_request:
    paths:
      - .github/workflows/prisma-source-contracts.yml
      - security/prisma-source-contracts.json
      - security/rust-toolchain.json
      - scripts/security/test-prisma-source.mjs
      - scripts/security/rust-toolchain.mjs
      - scripts/security/rust-source-audit.mjs
      - scripts/security/rebuild-esbuild.mjs
      - vendor/native/prisma/**
      - tests/scripts/prisma-source.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out candidate without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Use pinned Node executable
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject unreviewed fork build sources
        env:
          TRUSTED_REVIEW_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node -e "if (process.env.TRUSTED_REVIEW_SOURCE !== 'true') process.exit(1)"
      - name: Verify Node and install without lifecycle scripts
        run: |
          npm run runtime:version
          npm ci --ignore-scripts
      - name: Verify source bindings and rejection tests
        run: node --test tests/scripts/prisma-source.test.js
      - name: Test patched source modules without database or production credentials
        run: node scripts/security/test-prisma-source.mjs --upstream-units
      - name: Upload test evidence without approving the complete engine
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: prisma-source-contracts-${{ matrix.os }}-${{ github.run_id }}
          path: .audit/native-prisma/
          if-no-files-found: warn
          retention-days: 45
