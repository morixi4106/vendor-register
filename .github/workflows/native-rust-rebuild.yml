name: Native Rust rebuild verification

on:
  pull_request:
    paths:
      - .github/workflows/native-rust-rebuild.yml
      - security/**
      - scripts/security/**
      - vendor/native/**
      - tests/scripts/*runner*
      - tests/scripts/rust-toolchain.test.js
      - tests/fixtures/native-runner/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  function-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out candidate without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Use pinned Node executable
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject unreviewed fork build sources
        env:
          TRUSTED_REVIEW_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node -e "if (process.env.TRUSTED_REVIEW_SOURCE !== 'true') process.exit(1)"
      - name: Verify Node and install without lifecycle scripts
        run: |
          npm run runtime:version
          npm ci --ignore-scripts
      - name: Verify source policies and rejection tests
        run: node --test tests/scripts/rust-toolchain.test.js tests/scripts/rebuild-function-runner.test.js
      - name: Build and test patched Runner without production credentials
        run: node scripts/security/rebuild-function-runner.mjs
      - name: Upload candidate evidence without approving deployment
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: function-runner-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: .audit/native-runner/
          if-no-files-found: warn
          retention-days: 45
