name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendor_register_ci?schema=public
      SHOPIFY_API_KEY: ci-api-key
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: https://example.test
      SCOPES: read_products
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm

      - name: Require trusted review source
        env:
          TRUSTED_REVIEW_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node -e "if (process.env.TRUSTED_REVIEW_SOURCE !== 'true') { console.error('Untrusted fork must be reviewed in a trusted branch before builds or acceptance.'); process.exit(1); }"

      - name: Read risk acceptance workflow inputs
        id: risk-acceptance
        env:
          BUILD_TOOLCHAIN_RISK_POLICY: condition-bound-build-only-v1
          RISK_CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: >-
          node scripts/security/risk-acceptance-provenance.mjs
          emit-workflow-outputs

      - name: Download reviewed production audit evidence
        if: steps.risk-acceptance.outputs.download_reviewed == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, node24
        with:
          name: ${{ steps.risk-acceptance.outputs.reviewed_artifact_name }}
          path: .audit/reviewed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.risk-acceptance.outputs.reviewed_run_id }}

      - name: Verify accepted risk provenance
        if: steps.risk-acceptance.outputs.accepted == 'true'
        env:
          BUILD_TOOLCHAIN_RISK_POLICY: condition-bound-build-only-v1
          GITHUB_TOKEN: ${{ github.token }}
          RISK_CURRENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          RISK_CURRENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RISK_CURRENT_PR_NUMBER: ${{ github.event.pull_request.number || steps.risk-acceptance.outputs.reviewed_pull_request }}
        run: node scripts/security/risk-acceptance-provenance.mjs verify

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact patched Node executable
        run: npm run runtime:version

      - name: Rebuild esbuild with the reviewed patched Go toolchain
        run: npm run native:esbuild

      - name: Remove stale build artifacts
        run: node scripts/security/clean-audit-artifacts.mjs --all --apply

      - name: Check Prisma schema
        run: |
          npm exec --offline -- prisma format --schema=prisma/schema.prisma
          git diff --exit-code -- prisma/schema.prisma
          npm exec --offline -- prisma validate --schema=prisma/schema.prisma
          npm exec --offline -- prisma generate --schema=prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Check text encoding
        run: npm run check:text

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Check security documents
        run: node scripts/security/scan-security-documents.mjs

      - name: Test
        run: npm run test:pricing

      - name: Enforce production audit coverage
        run: npm run audit:production:test

      - name: Require reviewed native tools and current incident audit
        run: npm run audit:incident

      - name: Test checkout validation function
        run: |
          npm run build:function:types
          git diff --exit-code -- extensions/marketplace-purchase-control/generated/api.ts
          npm run test:checkout-function

      - name: Build Shopify extensions for artifact verification
        run: npm run build:extensions

      - name: Build React Router app for artifact verification
        run: npm run build

      - name: Verify isolated production runtime package
        run: npm run runtime:check

      - name: Remove generated Shopify manifests
        run: node scripts/security/clean-audit-artifacts.mjs --apply

      - name: Check generated repository diff
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Audit production dependencies
        env:
          BUILD_TOOLCHAIN_RISK_POLICY: condition-bound-build-only-v1
          PRODUCTION_AUDIT_WRITE_REVIEW_EVIDENCE: "true"
          RISK_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RISK_REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: npm run audit:production

      - name: Upload production audit review evidence
        if: always() && hashFiles('.audit/production-audit-review-evidence.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: production-audit-review-evidence-${{ github.run_id }}
          path: .audit/production-audit-review-evidence.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload incident inventory even when promotion is blocked
        if: always() && hashFiles('.audit/october-incident.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: october-incident-${{ github.run_id }}
          path: .audit/october-incident.json
          if-no-files-found: error
          retention-days: 45

  runtime-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Use pinned Node executable
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Node executable before installation
        run: npm run runtime:version
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Rebuild and scan esbuild binaries for both target platforms
        run: npm run native:esbuild
      - name: Verify Node and patched dependencies
        run: |
          npm run runtime:version
          node --test tests/scripts/node-runtime.test.js tests/scripts/deepmerge-security-backport.test.js tests/scripts/vendor-patches.test.js tests/scripts/native-inventory.test.js tests/scripts/incident-enforcement.test.js tests/scripts/runtime-package.test.js tests/scripts/safe-build.test.js tests/scripts/rebuild-esbuild.test.js
      - name: Upload reproducible esbuild and vulnerability evidence
        if: always() && hashFiles('.audit/native-esbuild/*.receipt.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: esbuild-patched-${{ matrix.os }}-${{ github.run_id }}
          path: .audit/native-esbuild/
          if-no-files-found: error
          retention-days: 45

  rust-source-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
      - name: Use pinned Node executable
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Node executable
        run: npm run runtime:version
      - name: Install parsers without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Assess complete source lock graphs against current Rust advisories
        run: npm run native:rust-audit
      - name: Upload source assessment without treating it as binary approval
        if: always() && hashFiles('.audit/rust-source/*-assessment.json') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, node24
        with:
          name: rust-source-assessment-${{ github.run_id }}
          path: .audit/rust-source/
          if-no-files-found: error
          retention-days: 45
