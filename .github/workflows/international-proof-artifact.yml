name: International proof artifact

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendor_register_ci?schema=public
      SHOPIFY_API_KEY: ci-api-key
      SHOPIFY_API_SECRET: ci-api-secret
      SHOPIFY_APP_URL: https://example.test
      SCOPES: read_products
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Require trusted source
        env:
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: node -e "if (process.env.TRUSTED_SOURCE !== 'true') process.exit(1)"
      - run: npm ci
      - run: node scripts/security/clean-audit-artifacts.mjs --all --apply
      - run: npm exec --offline -- prisma generate --schema=prisma/schema.prisma
      - run: npm run lint
      - run: npm run check:text
      - run: npm run check:architecture
      - run: npm run test:pricing
      - run: npm run build:function:types
      - run: npm run test:checkout-function
      - run: npm run build:extensions
      - run: npm run build
      - run: npm run runtime:check
      - name: Test exact prebuilt files and export manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/international-proof-artifact.mjs
      - run: node scripts/security/clean-audit-artifacts.mjs --apply
      - name: Check generated diff
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: international-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .audit/international-proof-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 45
          compression-level: 0
