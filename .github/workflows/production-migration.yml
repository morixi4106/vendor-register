name: Production database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PRODUCTION to continue
        required: true
      backup_reference:
        description: Render/Postgres backup or snapshot reference
        required: true

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE_PRODUCTION' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Check out the exact release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify migration authorization
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "MIGRATE_PRODUCTION"
          test -n "${{ inputs.backup_reference }}"
          test -n "$DATABASE_URL"
          echo "Backup reference recorded: ${{ inputs.backup_reference }}"

      - name: Verify exact Node executable
        run: node scripts/security/node-runtime.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Block migrations with unresolved incident dependencies
        run: |
          npm run native:esbuild
          npm run audit:incident

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Pre-migration audit
        run: npm run audit:operational-migration

      - name: Apply pending migrations
        run: npx prisma migrate deploy

      - name: Post-migration audit
        run: npm run audit:operational-migration -- --require-current-schema
