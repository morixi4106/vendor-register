name: Daily maintenance checks

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: daily-maintenance-checks
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ vars.MAINTENANCE_SECURITY_CHECKS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/quality.yml
