name: Shopify product catalog sync

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-product-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MAINTENANCE_SCHEDULER != 'render' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version

      - name: Verify exact Node executable
        run: node scripts/security/node-runtime.mjs

      - name: Reconcile Shopify product catalog
        env:
          APP_URL: ${{ vars.LAUNCH_MONITOR_URL }}
          SHOPIFY_PRODUCT_CATALOG_SYNC_TOKEN: ${{ secrets.SHOPIFY_PRODUCT_CATALOG_SYNC_TOKEN }}
        run: node scripts/shopify-product-catalog-sync-agent.mjs

      - name: Reconcile recently paid and edited orders
        if: always()
        env:
          APP_URL: ${{ vars.LAUNCH_MONITOR_URL }}
          SHOPIFY_PRODUCT_CATALOG_SYNC_TOKEN: ${{ secrets.SHOPIFY_PRODUCT_CATALOG_SYNC_TOKEN }}
        run: node scripts/security/node-runtime.mjs && node scripts/shopify-order-integrity-agent.mjs
