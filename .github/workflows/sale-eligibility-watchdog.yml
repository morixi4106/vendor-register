name: Independent sale eligibility watchdog

on:
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate the dedicated Shopify credentials and internal heartbeat without changing purchase state"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: independent-sale-eligibility-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.SALE_ELIGIBILITY_WATCHDOG_ENABLED == 'true') }}
    environment: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24

      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version

      - name: Verify exact Node executable
        run: node scripts/security/node-runtime.mjs

      - name: Enforce purchase fail-safe
        env:
          LAUNCH_MONITOR_URL: ${{ vars.LAUNCH_MONITOR_URL }}
          SALE_ELIGIBILITY_WATCHDOG_TOKEN: ${{ secrets.SALE_ELIGIBILITY_WATCHDOG_TOKEN }}
          SHOPIFY_WATCHDOG_SHOP_DOMAIN: ${{ vars.SHOPIFY_WATCHDOG_SHOP_DOMAIN }}
          SALE_ELIGIBILITY_WATCHDOG_ENABLED: ${{ vars.SALE_ELIGIBILITY_WATCHDOG_ENABLED }}
          SHOPIFY_WATCHDOG_CLIENT_ID: ${{ secrets.SHOPIFY_WATCHDOG_CLIENT_ID }}
          SHOPIFY_WATCHDOG_CLIENT_SECRET: ${{ secrets.SHOPIFY_WATCHDOG_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.validation_only }}" = "true" ]; then
            node scripts/sale-eligibility-watchdog-agent.mjs --validate-only
          else
            node scripts/sale-eligibility-watchdog-agent.mjs
          fi
