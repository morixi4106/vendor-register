name: Routine maintenance promotion

on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: routine-maintenance-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ vars.AUTO_MAINTENANCE_MERGE_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maintenance
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out protected main only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, node24
        with:
          node-version-file: .node-version
      - name: Verify exact Node executable
        run: node scripts/security/node-runtime.mjs
      - name: Install trusted classifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Merge allowlisted development patches without changing the sales release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTO_MAINTENANCE_MERGE_ENABLED: ${{ vars.AUTO_MAINTENANCE_MERGE_ENABLED }}
          LAUNCH_MONITOR_URL: ${{ vars.LAUNCH_MONITOR_URL }}
          MAINTENANCE_GATE_TOKEN: ${{ secrets.MAINTENANCE_GATE_TOKEN }}
          MAINTENANCE_SECONDARY_RECEIPT_ISSUE: ${{ vars.MAINTENANCE_SECONDARY_RECEIPT_ISSUE }}
        run: node scripts/maintenance-promotion.mjs
