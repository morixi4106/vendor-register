query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  shop {
    localTime {
      date
    }
    operationalPurchaseControl: metafield(
      namespace: "$app"
      key: "operational_purchase_control"
    ) {
      value
    }
    watchdogPurchaseStop: metafield(
      namespace: "vendor_register_watchdog"
      key: "purchase_stop"
    ) {
      value
    }
    komojuLimitedLaunchControl: metafield(
      namespace: "$app"
      key: "komoju_limited_launch_control"
    ) {
      value
    }
    internationalSaleGate: metafield(
      namespace: "$app"
      key: "international_sale_gate"
    ) {
      value
    }
  }
  cart {
    cost {
      totalAmount {
        amount
        currencyCode
      }
    }
    deliveryGroups {
      cartLines {
        id
      }
      deliveryAddress {
        countryCode
        zip
      }
    }
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          requiresShipping
          product {
            id
            internationalSaleEligibility: metafield(
              namespace: "$app"
              key: "international_sale_eligibility"
            ) {
              value
            }
            saleEligibilityProjection: metafield(
              namespace: "$app"
              key: "sale_eligibility_projection"
            ) {
              value
            }
          }
        }
      }
    }
  }
}
